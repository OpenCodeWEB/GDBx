[project]
name = "gdbx-py"
version = "0.1.0"
description = "GDBx Python SDK — self-sovereign mesh, gun-free"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==42.0.8",
  "blake3==0.4.1",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "pytest-asyncio==0.23.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
